name: Test, build and Deploy | Module 01 - Lab2.2 Senior Project

on:
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x]

    steps:
      - uses: actions/checkout@v4
      - name: Testing Build pre-Deploy
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm i
      - run: npm run build

deploy:
  needs: test-build
  runs-on: ubuntu-latest

  strategy:
    matrix:
      node-version: [16.x]

  steps:
  - name: Build app on VM
    uses: appleboy/ssh-action@master
    with:
      host: ${{ secrets.HOST }}
      username: ${{ secrets.USERNAME }}
      key: ${{ secrets.KEY }}
      port: ${{ secrets.PORT }}
      script: |
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/<<KEY_NAME_FROM_TA>>
        echo "Check project folder";
        [ ! -d "${HOME}/senpro/<<546873>>/modul02/senpro-github-action/"] &&
        {
          echo "Repository has not been cloned. Cloning. . .";
          mkdir -p ~/senpro/<<546873>>/modul02;
          git clone <<FORK_REPOSITORY_LINK>>;
          cd ~/senpro/<<546873>>/modul02/senpro-github-action;
          echo "Install Packages and Build Project";
          npm install;
          npm run build;
        } ||
        {
          echo "Repository already exists. Building. . .";
          cd ~/senpro/<<546873>>/modul02/senpro-github-action;
          git restore .;
          echo "Install Packages and Build Project";
          npm install;
          npm run build;
        }